# Release APK and AAB on main and on version tags.
# Firebase App Distribution runs only when FIREBASE_APP_ID and FIREBASE_TOKEN
# are set. Netlify runs only when NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are
# set. Missing secrets skip that publish. Secret values are never printed.
# This file is GitHub Actions. Cursor Origin stores it and does not run it.
# See docs/release/CI.md.
name: Release artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve version name and version code
        id: version
        run: |
          set -euo pipefail
          name=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          fi
          code=$((100000 + GITHUB_RUN_NUMBER))
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "versionName=${name} versionCode=${code}"

      - name: Prepare the upload key when a keystore secret exists
        env:
          HOMIZI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.HOMIZI_UPLOAD_KEYSTORE_BASE64 }}
          HOMIZI_UPLOAD_STORE_PASSWORD: ${{ secrets.HOMIZI_UPLOAD_STORE_PASSWORD }}
          HOMIZI_UPLOAD_KEY_ALIAS: ${{ secrets.HOMIZI_UPLOAD_KEY_ALIAS }}
          HOMIZI_UPLOAD_KEY_PASSWORD: ${{ secrets.HOMIZI_UPLOAD_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "${HOMIZI_UPLOAD_KEYSTORE_BASE64}" ]; then
            echo "No HOMIZI_UPLOAD_KEYSTORE_BASE64 secret. The release build will use the debug keystore and must not be uploaded to Play."
            exit 0
          fi
          if [ -z "${HOMIZI_UPLOAD_STORE_PASSWORD}" ] || [ -z "${HOMIZI_UPLOAD_KEY_ALIAS}" ] || [ -z "${HOMIZI_UPLOAD_KEY_PASSWORD}" ]; then
            echo "The upload keystore secret is set, but the alias or a password secret is missing. Nothing was printed."
            exit 1
          fi
          umask 077
          if ! printf '%s' "${HOMIZI_UPLOAD_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload-keystore.jks"; then
            echo "The upload keystore could not be decoded. The secret value was not printed."
            exit 1
          fi
          echo "HOMIZI_UPLOAD_STORE_FILE=${RUNNER_TEMP}/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "Release signing file prepared."

      - name: Build release APK and app bundle
        env:
          HOMIZI_UPLOAD_STORE_PASSWORD: ${{ secrets.HOMIZI_UPLOAD_STORE_PASSWORD }}
          HOMIZI_UPLOAD_KEY_ALIAS: ${{ secrets.HOMIZI_UPLOAD_KEY_ALIAS }}
          HOMIZI_UPLOAD_KEY_PASSWORD: ${{ secrets.HOMIZI_UPLOAD_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"
          flutter build appbundle --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"

      - uses: actions/upload-artifact@v4
        with:
          name: homizi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: homizi-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: hashFiles('build/app/outputs/mapping/release/mapping.txt') != ''
        with:
          name: homizi-r8-mapping
          path: build/app/outputs/mapping/release/mapping.txt

  firebase:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: See whether Firebase secrets are configured
        id: firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          if [ -n "${FIREBASE_APP_ID}" ] && [ -n "${FIREBASE_TOKEN}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase App Distribution skipped. Set FIREBASE_APP_ID and FIREBASE_TOKEN to upload a test build. Nothing was published."
          fi

      - uses: actions/download-artifact@v4
        if: steps.firebase.outputs.ready == 'true'
        with:
          name: homizi-release-apk
          path: dist

      - name: Upload the release APK to Firebase App Distribution
        if: steps.firebase.outputs.ready == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          npm install -g firebase-tools
          firebase appdistribution:distribute dist/app-release.apk \
            --app "${FIREBASE_APP_ID}" \
            --release-notes "HOMIZI release ${GITHUB_SHA}. If the Android job logged the debug-keystore warning, this build is not a Play upload."

  netlify:
    runs-on: ubuntu-latest
    steps:
      - name: See whether Netlify secrets are configured
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Netlify deploy skipped. Set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID to publish the web app. Nothing was deployed."
            exit 0
          fi
          if [ "${NETLIFY_SITE_ID}" != "6996ebdd-3786-4add-b348-00c5de0725e1" ]; then
            echo "Netlify deploy refused. NETLIFY_SITE_ID is not the HOMIZI site documented in docs/release/CI.md. Nothing was deployed."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.netlify.outputs.ready == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.netlify.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Build and deploy the web app
        if: steps.netlify.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set +x
          set -euo pipefail
          flutter pub get
          flutter build web --release --dart-define-from-file=config/staging.json
          python3 tool/install_web_sw.py build/web
          python3 tool/check_web_pwa.py build/web
          npx --yes netlify-cli deploy --prod --dir=build/web
