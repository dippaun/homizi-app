<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/homizi-app/">
  <script>
    // Hash routes are the Flutter location. A path such as /privacy (or the
    // GitHub Pages 404 fallback that serves this file) is rewritten to
    // /#/privacy before the app boots.
    (function () {
      var legal = {
        privacy: true,
        terms: true,
        support: true,
        'delete-account': true
      };
      var baseEl = document.querySelector('base');
      var base = (baseEl && baseEl.getAttribute('href')) || '/';
      if (base.charAt(0) !== '/') {
        try {
          base = new URL(base, location.origin).pathname;
        } catch (e) {
          base = '/';
        }
      }
      if (base.charAt(base.length - 1) !== '/') {
        base += '/';
      }
      var path = location.pathname;
      if (path.indexOf(base) !== 0) {
        return;
      }
      var rest = path.substring(base.length).replace(/\/+$/, '');
      var hashPath = (location.hash || '').replace(/^#\/?/, '').replace(/\/+$/, '');
      if (legal[rest] && hashPath !== rest) {
        location.replace(base + '#/' + rest + location.search);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HOMIZI. Verified rental and flatmate discovery.">
  <meta name="theme-color" content="#F75620">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HOMIZI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HOMIZI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F75620;
    }
    #homizi-loader {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F75620;
    }
    #homizi-loader .mark {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #FFFFFF;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 16px;
      box-sizing: border-box;
    }
    #homizi-loader .mark span {
      background: #F75620;
      border-radius: 6px;
      animation: homizi-pulse 1.2s ease-in-out infinite;
    }
    @keyframes homizi-pulse {
      50% { opacity: 0.45; }
    }
    .flutter-loader {
      background: #F75620 !important;
    }
    /* Author display would otherwise override the hidden attribute. */
    #homizi-update[hidden] {
      display: none !important;
    }
    #homizi-update {
      position: fixed;
      z-index: 10000;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #141414;
      color: #FFFFFF;
      border-radius: 12px;
      font: 600 14px/1.4 sans-serif;
    }
    #homizi-update p {
      margin: 0;
    }
    #homizi-update button {
      background: #F75620;
      color: #141414;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font: 700 14px/1 sans-serif;
    }
  </style>
</head>
<body>
  <div id="homizi-loader" role="status" aria-label="Loading HOMIZI">
    <div class="mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('homizi-loader');
      if (loader) {
        loader.remove();
      }
    });
  </script>
  <div id="homizi-update" hidden role="status">
    <p>A new version of HOMIZI is available.</p>
    <button type="button" id="homizi-update-action">Update</button>
  </div>
  <script>
    (function () {
      var banner = document.getElementById('homizi-update');
      var button = document.getElementById('homizi-update-action');
      if (!banner || !button || !('serviceWorker' in navigator)) {
        return;
      }
      var prompted = false;
      var watching = false;
      function showPrompt() {
        if (prompted) {
          return;
        }
        prompted = true;
        banner.hidden = false;
      }
      button.addEventListener('click', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          var waiting = reg && reg.waiting;
          if (waiting && waiting.postMessage) {
            waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          window.location.reload();
        });
      });
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController) {
          showPrompt();
          return;
        }
        hadController = true;
      });
      function watch(reg) {
        if (!reg || watching) {
          return;
        }
        watching = true;
        if (reg.waiting && navigator.serviceWorker.controller) {
          showPrompt();
        }
        reg.addEventListener('updatefound', function () {
          var worker = reg.installing;
          if (!worker) {
            return;
          }
          worker.addEventListener('statechange', function () {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              showPrompt();
            }
          });
        });
      }
      function look() {
        navigator.serviceWorker.getRegistration().then(watch).catch(function () {});
      }
      look();
      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        look();
        if (watching || tries > 20) {
          clearInterval(timer);
        }
      }, 500);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') {
          return;
        }
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg && reg.update) {
            reg.update();
          }
        }).catch(function () {});
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="firebase-config.js"></script>
  <script>
    window.homiziOpenRazorpay = function (options) {
      return new Promise(function (resolve) {
        function open() {
          var checkout = new Razorpay(Object.assign({}, options, {
            handler: function (response) {
              if (options.handler) {
                options.handler(response);
              }
              resolve({ ok: true, payment_id: response && response.razorpay_payment_id });
            },
            modal: Object.assign({}, options.modal, {
              ondismiss: function () {
                if (options.modal && options.modal.ondismiss) {
                  options.modal.ondismiss();
                }
                resolve({ ok: false, dismissed: true });
              }
            })
          }));
          checkout.on('payment.failed', function () {
            resolve({ ok: false, failed: true });
          });
          checkout.open();
        }
        if (window.Razorpay) {
          open();
          return;
        }
        var script = document.createElement('script');
        script.src = 'https://checkout.razorpay.com/v1/checkout.js';
        script.onload = open;
        script.onerror = function () {
          resolve({ ok: false, error: 'checkout_unavailable' });
        };
        document.head.appendChild(script);
      });
    };
  </script>
  <script>
    // Maps JavaScript. Loaded only when MAPS_API_KEY was compiled in.
    // Places API (New) REST is called from Dart. Geocoding and travel time
    // stay in this script: the legacy web-service REST endpoints return
    // REQUEST_DENIED for a referrer-restricted key.
    window.homiziEnsureMaps = function (key) {
      if (!key) {
        return Promise.reject(new Error('empty'));
      }
      if (window.google && window.google.maps &&
          window.google.maps.Geocoder &&
          window.google.maps.DistanceMatrixService) {
        return Promise.resolve();
      }
      if (window.homiziMapsReady) {
        return window.homiziMapsReady;
      }
      window.homiziMapsReady = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' +
          encodeURIComponent(key) + '&v=weekly&libraries=places';
        script.async = true;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('maps')); };
        document.head.appendChild(script);
      });
      return window.homiziMapsReady;
    };
    window.homiziMountOfficeMap = function (el, key, lat, lng, label) {
      if (!el || !key) {
        return;
      }
      el.style.width = '100%';
      el.style.height = '100%';
      window.homiziEnsureMaps(key).then(function () {
        var map = new google.maps.Map(el, {
          center: { lat: lat, lng: lng },
          zoom: 15,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: false,
          clickableIcons: false
        });
        new google.maps.Marker({
          position: { lat: lat, lng: lng },
          map: map,
          title: label || 'My Office'
        });
      }).catch(function () {});
    };

    // Locality circle for a listing. No marker: the circle is the area,
    // not the building. An empty key never inserts the Google script.
    window.homiziMountAreaMap = function (el, key, lat, lng, radius, showPin) {
      if (!el || !key) {
        return;
      }
      el.style.width = '100%';
      el.style.height = '100%';
      window.homiziEnsureMaps(key).then(function () {
        var center = { lat: lat, lng: lng };
        var map = new google.maps.Map(el, {
          center: center,
          zoom: 14,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: false,
          clickableIcons: false
        });
        new google.maps.Circle({
          map: map,
          center: center,
          radius: radius || 700,
          strokeColor: '#F75620',
          strokeOpacity: 0.95,
          strokeWeight: 2,
          fillColor: '#F75620',
          fillOpacity: 0.18,
          clickable: false
        });
        if (showPin) {
          new google.maps.Marker({
            position: center,
            map: map,
            title: 'Approximate area'
          });
        }
      }).catch(function () {});
    };
    window.homiziReverseGeocode = function (key, lat, lng) {
      return window.homiziEnsureMaps(key).then(function () {
        return new Promise(function (resolve) {
          var geocoder = new google.maps.Geocoder();
          geocoder.geocode({ location: { lat: lat, lng: lng } }, function (results, status) {
            if (status !== 'OK' || !results || !results.length) {
              resolve(null);
              return;
            }
            resolve(JSON.stringify({
              status: 'OK',
              results: results.map(function (result) {
                return {
                  formatted_address: result.formatted_address || '',
                  types: result.types || [],
                  address_components: (result.address_components || []).map(function (part) {
                    return {
                      long_name: part.long_name || '',
                      types: part.types || []
                    };
                  })
                };
              })
            }));
          });
        });
      }).catch(function () { return null; });
    };
    window.homiziMeasureDistances = function (key, lat, lng, destinationsJson, mode) {
      return window.homiziEnsureMaps(key).then(function () {
        return new Promise(function (resolve) {
          var destinations;
          try {
            destinations = JSON.parse(destinationsJson);
          } catch (error) {
            resolve(null);
            return;
          }
          var travel = google.maps.TravelMode.DRIVING;
          if (mode === 'WALKING') {
            travel = google.maps.TravelMode.WALKING;
          } else if (mode === 'TRANSIT') {
            travel = google.maps.TravelMode.TRANSIT;
          }
          var service = new google.maps.DistanceMatrixService();
          service.getDistanceMatrix({
            origins: [{ lat: lat, lng: lng }],
            destinations: destinations.map(function (point) {
              return { lat: point.lat, lng: point.lng };
            }),
            travelMode: travel,
            unitSystem: google.maps.UnitSystem.METRIC
          }, function (response, status) {
            if (status !== 'OK' || !response || !response.rows || !response.rows[0]) {
              resolve(null);
              return;
            }
            resolve(JSON.stringify(response.rows[0].elements.map(function (element) {
              if (!element || element.status !== 'OK' || !element.distance || !element.duration) {
                return null;
              }
              return {
                meters: element.distance.value,
                seconds: element.duration.value
              };
            })));
          });
        });
      }).catch(function () { return null; });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
